<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New Royal Cars — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050607;
        color: #e5e5e5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .glyph {
        width: 96px;
        height: 64px;
        margin: 0 auto 26px;
        opacity: 0.9;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      p {
        margin: 12px 0 0;
        font-size: 13.5px;
        line-height: 1.6;
        color: #8b8f96;
      }
      .brand {
        margin-top: 26px;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #c9a227;
      }
      button {
        margin-top: 30px;
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: 1px solid rgba(201, 162, 39, 0.35);
        background: linear-gradient(180deg, rgba(201, 162, 39, 0.18), rgba(201, 162, 39, 0.08));
        color: #f3e9c8;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.985);
      }
      .hint {
        margin-top: 14px;
        font-size: 11.5px;
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Same New Royal Cars line-art mark used for the launcher icon. -->
      <svg class="glyph" viewBox="0 0 82 54" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 38 L22 38 M60 38 L70 38" />
          <path d="M10 38c0-3 1-5 4-6l6-1 9-14c1.6-2.4 3.6-3.6 6.5-3.6h17c3 0 5 1.2 6.6 3.6l9 14 6 1c3 1 4 3 4 6" />
          <path d="M34 15h14" />
          <rect x="26" y="35" width="9" height="9" rx="4.5" />
          <rect x="47" y="35" width="9" height="9" rx="4.5" />
        </g>
        <rect x="8" y="49" width="66" height="2.2" rx="1.1" fill="#ffffff" />
      </svg>

      <h1>No internet connection</h1>
      <p>
        New Royal Cars needs an internet connection to show the live showroom.
        Check your network, then try again.
      </p>

      <button id="retry" type="button">Try again</button>
      <div class="hint" id="hint">Reconnecting will load the live website.</div>

      <div class="brand">New Royal Cars</div>
    </div>

    <script>
      // The native shell passes the configured site origin as ?site=... so this
      // page always aims at the same origin as capacitor.config.ts.
      var params = new URLSearchParams(window.location.search);
      var SITE_URL = (params.get('site') || 'https://new-royal-cars-car-delearship.vercel.app/').trim();
      if (!/^https?:\/\//i.test(SITE_URL)) SITE_URL = 'https://' + SITE_URL;

      var retry = document.getElementById('retry');
      var hint = document.getElementById('hint');

      function reload() {
        hint.textContent = 'Retrying\u2026';
        // Preferred: ask the native shell (no navigation interception involved).
        try {
          if (window.NRCAndroid && typeof window.NRCAndroid.retry === 'function') {
            window.NRCAndroid.retry();
            return;
          }
        } catch (e) {
          /* fall through to a plain navigation */
        }
        window.location.replace(SITE_URL);
      }

      retry.addEventListener('click', reload);

      window.addEventListener('online', function () {
        hint.textContent = 'Back online \u2014 retrying\u2026';
        reload();
      });
    </script>
  </body>
</html>
